<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Playlist Manager</title>
  <style>
  /* 1. Global Reset and Typography */
  :root {
    --primary: #6366f1; /* Modern Indigo */
    --primary-hover: #4f46e5;
    --bg-color: #f3f4f6;
    --card-bg: #ffffff;
    --text-main: #1f2937;
    --text-muted: #6b7280;
    --border-color: #e5e7eb;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    max-width: 900px;
    margin: 40px auto; /* Centers the app on large screens */
    padding: 0 20px;
    line-height: 1.5;
  }

  h1 {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 30px;
    letter-spacing: -0.5px;
  }

  h2, h3 {
    margin-top: 0;
    font-weight: 600;
    color: var(--text-main);
  }

  /* 2. Card Layout (The "Boxes") */
  .box {
    background-color: var(--card-bg);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* 3. The "Now Playing" Hero Section */
  .now-playing-panel {
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    color: white;
    box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
    border: none;
    text-align: center;
  }
  
  .now-playing-panel h2 {
    color: white;
    font-size: 1.2rem;
    opacity: 0.9;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  #now-playing-text {
    font-size: 1.25rem;
    margin: 15px 0;
    font-weight: 300;
  }

  /* 4. Buttons */
  button {
    background-color: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  button:hover {
    background-color: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
  }

  /* Special buttons for Now Playing */
  .now-playing-panel button {
    background-color: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    margin: 0 5px;
    font-weight: 600;
  }

  .now-playing-panel button:hover {
    background-color: rgba(255, 255, 255, 0.3);
  }

  /* Table Remove Button */
  td button {
    background-color: #ef4444; /* Soft Red */
    padding: 6px 12px;
    font-size: 0.8rem;
  }
  td button:hover {
    background-color: #dc2626;
    box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
  }

  /* 5. Forms and Inputs */
  .form-group {
    margin-bottom: 15px;
    display: flex;
    align-items: center;
  }

  label {
    width: 100px;
    font-weight: 500;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  input[type="text"] {
    flex: 1;
    max-width: 300px;
    padding: 10px 12px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    background-color: #f9fafb;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--primary);
    background-color: #fff;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  /* 6. The Playlist Table */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  th, td {
    padding: 14px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
  }

  th {
    background-color: #f9fafb;
    color: var(--text-muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    border-bottom: 2px solid var(--border-color);
  }

  tbody tr {
    transition: background-color 0.15s ease;
  }

  tbody tr:hover {
    background-color: #f9fafb;
  }

  .active-row {
    background-color: #eef2ff !important; /* Very light indigo */
    border-left: 4px solid var(--primary);
  }

  .active-row td {
    color: var(--primary-hover);
    font-weight: 500;
  }

  #search-feedback {
    font-size: 0.9rem;
    font-weight: 500;
  }
</style>
</head>
<body>

  <h1>Music Playlist Manager</h1>

  <!-- Now Playing Section -->
  <div class="box now-playing-panel">
    <h2>Now Playing</h2>
    <p id="now-playing-text">No song playing.</p>
    <p>Total Songs in Playlist: <strong id="total-count">0</strong></p>
    <div>
      <button id="btn-prev">< Previous</button>
      <button id="btn-next">Next ></button>
    </div>
  </div>

  <!-- Search & Play Section -->
  <div class="box">
    <h3>Search Song</h3>
    <input type="text" id="search-input" placeholder="Enter Song ID or Title">
    <button id="btn-search">Search & Play</button>
    <span id="search-feedback" style="margin-left: 10px;"></span>
  </div>

  <!-- Add Song Form -->
  <div class="box">
    <h3>Add New Song</h3>
    <form id="add-song-form">
      <div class="form-group">
        <label for="song-id">Song ID:</label>
        <input type="text" id="song-id" required>
      </div>
      <div class="form-group">
        <label for="song-title">Title:</label>
        <input type="text" id="song-title" required>
      </div>
      <div class="form-group">
        <label for="song-artist">Artist:</label>
        <input type="text" id="song-artist" required>
      </div>
      <div class="form-group">
        <label for="song-duration">Duration:</label>
        <input type="text" id="song-duration" placeholder="e.g. 3:45" required>
      </div>
      <button type="submit">Add Song to Playlist</button>
    </form>
  </div>

  <!-- Playlist Table -->
  <div class="box">
    <h3>Current Playlist</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Artist</th>
          <th>Duration</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="playlist-table-body">
      </tbody>
    </table>
  </div>
  
  <footer style="text-align: center; padding: 30px 20px; margin-top: 40px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 0.9rem; font-family: system-ui, -apple-system, sans-serif;">
  <p style="margin: 0 0 12px 0;">Made with ❤️</p>
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <p style="margin: 0; color: #374151; font-weight: 500;">
      Anush Gupta <span style="color: #9ca3af; font-weight: 400; margin: 0 4px;">--</span> 25112011258
    </p>
    <p style="margin: 0; color: #374151; font-weight: 500;">
      Atharv Gupta <span style="color: #9ca3af; font-weight: 400; margin: 0 4px;">--</span> 25112011251
    </p>
  </div>
</footer>
  <script src="script.js"></script>
</body>
</html>
